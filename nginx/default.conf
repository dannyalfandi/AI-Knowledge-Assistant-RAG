server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # index.html itself must never be cached — a new deploy has to be picked
    # up on the next reload. The rest of the Flutter web output (main.dart.js,
    # assets/, etc.) is already content-hashed by the build, so the browser's
    # normal caching is fine for it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the backend service — inside the Compose network it's
    # reachable at "backend", not localhost. No path after the host:port in
    # proxy_pass, so the full request URI (including the /api/ prefix, which
    # the backend itself expects) is forwarded unmodified.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: go_router handles routing client-side, so any path that
    # isn't a real static file (a refresh on /admin, /documents, ...) falls
    # back to index.html instead of a Nginx 404, and go_router takes it from
    # there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
